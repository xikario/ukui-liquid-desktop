name: Fences portable regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-xvfb:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qtbase5-dev libqt5svg5-dev libgl1-mesa-dev libx11-dev zlib1g-dev xvfb xauth dbus-x11 python3-pil python3-reportlab poppler-utils tesseract-ocr libglib2.0-bin
      - name: System application blur compatibility
        run: |
          python3 integration/peony/test_blur_compat.py
          xvfb-run -a python3 integration/peony/test_blur_compat_x11.py
      - name: Configure and build
        run: |
          cmake -S apps/ukui-fences -B build/fences -DBUILD_TESTING=ON -DLIQUID_POPUP_BUILD_DEMO=ON
          cmake --build build/fences -j2
      - name: Python, menu, file operation and HiDPI regressions
        working-directory: build/fences
        run: ctest --output-on-failure -R '^smart_space_(indexer|knowledge)$|^liquid-popup|^liquid-material|^desktop_(appearance|icon-appearance|icon-damage|smart-interaction|folder_drop_undo|clipboard|review_async|monitor_placement|startup_wallpaper)|^fence_glass_cpu$|^calendar_holiday_sync$'
      - name: Appearance lifecycle regression
        working-directory: build/fences
        run: ctest --output-on-failure --repeat until-fail:10 -R '^desktop_appearance_1$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/fences/Testing/Temporary/
            build/fences/artifacts/
            build/fences/liquid-popup/artifacts/
  launcher-panel:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [ukui-kaishicaidan-v2, ukui-panel-liquid]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ qtbase5-dev libx11-dev libxtst-dev libgl1-mesa-dev xvfb xauth dbus-x11 xdotool x11-utils
      - name: Build
        run: |
          cmake -S apps/${{ matrix.app }} -B build/app -DBUILD_TESTING=ON
          cmake --build build/app -j2
      - name: Regressions
        run: ctest --test-dir build/app --output-on-failure
      - name: Launcher button and Super key
        if: matrix.app == 'ukui-kaishicaidan-v2'
        env:
          UKUI_KAISHICAIDAN_V2_BIN: ${{ github.workspace }}/build/app/ukui-kaishicaidan-v2
        run: env QT_FONT_DPI=96 QT_SCALE_FACTOR=1.5 QT_SCREEN_SCALE_FACTORS=1 xvfb-run -a -s '-screen 0 1920x1200x24' dbus-run-session -- python3 apps/ukui-kaishicaidan-v2/tests/button-follow-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.app }}
          path: build/app/Testing/Temporary/
